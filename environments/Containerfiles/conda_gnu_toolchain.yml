# GNU toolchain half of the gnu CI image's environment. Containerfile_gnu
# combines this with the shared conda_python_deps.yml in a single
# `micromamba create -f ... -f ...` solve; the ifx image consumes only the
# python-deps file (its Fortran stack is built from source with OneAPI, since
# conda-forge libraries are gfortran-built and .mod-incompatible with ifx).
name: roms-ci
channels:
  - conda-forge
dependencies:
  - compilers
  # Pin the GNU toolchain and keep conda-gcc-specs out of the environment.
  # conda-forge's gxx 14.4.0 build _1 (2026-07-30) flipped to depending on the
  # conda-gcc-specs variant of gcc; that package's specs file rewrites
  # *link_command: and drops crtendS.o/crtn.o from libtool's shared-object
  # links, so Score-P's bundled cubelib fails to link its plugins with
  # undefined `__TMC_END__'. conda-forge documents conda-gcc-specs as
  # unsuitable for build environments. 14.3 is the series that last built
  # this image successfully (2026-07-09).
  - gcc=14.3
  - gxx=14.3
  - gfortran=14.3
  - gcc-no-conda-specs=14.3
  - binutils=2.45.1
  - netcdf-fortran
  - mpich
  # PnetCDF: required to build ParallelIO in Containerfile_gnu and to link ROMS
  # when PARALLEL_IO is defined (Makedefs.inc adds -lpnetcdf). The mpich pin
  # above forces the mpi_mpich_* build variant.
  - libpnetcdf
  # Interactive conveniences for developers using the gnu image; kept out of
  # the shared python-deps file to keep the ifx image lean.
  - ipykernel
  - jupyter
